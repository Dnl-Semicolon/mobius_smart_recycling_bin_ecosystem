name: Mobius
options:
  bundleIdPrefix: com.mobiusvision
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.3"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "DR36945M9P"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1

targets:
  Mobius:
    type: application
    platform: iOS
    sources:
      - path: Mobius/Sources
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Mobius/Sources/Info.plist
      properties:
        CFBundleDisplayName: Mobius
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Mobius needs camera access to scan QR codes on recycling bins."
        NSLocationWhenInUseUsageDescription: "Mobius uses your location to find nearby recycling bins."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
