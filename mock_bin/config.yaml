bin:
  serial: "MBR-2026-001"
  name: "Starbucks Gurney Plaza - Bin 1"

location:
  latitude: 5.4370
  longitude: 100.3100
  description: "Near entrance, left of cashier"

backend:
  url: "http://localhost:8000/api/v1"

server:
  host: "0.0.0.0"
  port: 9001

hardware:
  platform: "mock"
  camera_index: 0

vision:
  detector: "hybrid"  # hybrid = YOLO for type + OpenAI for brand | also: openai, yolo, mock
  openai_model: "gpt-4o-mini"
  confidence_threshold: 40
  accept_threshold: 70
  model_path: "models/mobius-cup-v1.pt"

display:
  kiosk_mode: false
  show_dev_controls: true

timers:
  heartbeat_interval_sec: 30
  user_session_timeout_sec: 60
  detection_cooldown_sec: 3
  result_display_sec: 5
  drain_duration_sec: 3.5

compartments:
  solids:
    max_volume_ml: 15000
    max_weight_g: 5000
  liquid:
    max_volume_ml: 3000
    max_weight_g: 3000
