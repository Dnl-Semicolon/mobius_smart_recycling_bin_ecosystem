name: Reader
options:
  bundleIdPrefix: com.mobiusvision
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  SWIFT_VERSION: "6.0"
  SWIFT_STRICT_CONCURRENCY: complete
targets:
  Reader:
    type: application
    platform: iOS
    sources:
      - path: Reader/Sources
      - path: Reader/Resources
        type: folder
        buildPhase: resources
    info:
      path: Reader/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      DEVELOPMENT_TEAM: "DR36945M9P"
      CODE_SIGN_STYLE: Automatic
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_CFBundleDisplayName: "Sprint 4"
      PRODUCT_BUNDLE_IDENTIFIER: com.mobiusvision.sprint4reader
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
